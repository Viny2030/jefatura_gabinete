name: Presupuesto y SIGEN — semanal

# Presupuesto Abierto (MECON) publica el crédito y la ejecución 2026 varias
# veces por mes. SIGEN publica informes de auditoría esporádicamente.
on:
  schedule:
    - cron: "30 10 * * 1"   # lunes 07:30 ART
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Presupuesto JGM (Presupuesto Abierto / MECON)
        id: presupuesto
        continue-on-error: true
        run: python scripts/generar_presupuesto_jgm.py

      # SIGEN corta las conexiones desde fuera de Argentina: es probable que
      # falle en GitHub Actions. En ese caso usar scripts/actualizar_sigen.ps1
      # desde una PC en Argentina.
      - name: Informes SIGEN
        id: sigen
        continue-on-error: true
        run: python scripts/generar_sigen_auditorias.py

      - name: Resumen
        if: always()
        run: |
          echo "| Fuente | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Presupuesto Abierto | ${{ steps.presupuesto.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SIGEN | ${{ steps.sigen.outcome }} (si falla: scripts/actualizar_sigen.ps1) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/frontend/data/presupuesto_jgm.json src/frontend/data/sigen_auditorias.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "chore: presupuesto y SIGEN [$(date -u '+%Y-%m-%d')]"
          git pull --rebase origin main
          git push
